name: macOS paket

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Derle
        run: python -m PyInstaller --noconfirm --clean KozmoStok.spec

      - name: Ad-hoc imza (Apple Silicon "hasar gormus" hatasini onler)
        run: |
          codesign --force --deep --sign - dist/KozmoStok.app
          codesign --verify --deep --strict --verbose=2 dist/KozmoStok.app

      - name: Zip ve DMG
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent KozmoStok.app KozmoStok-mac.zip
          shasum -a 256 KozmoStok-mac.zip > KozmoStok-mac.zip.sha256
          hdiutil create -volname KozmoStok -srcfolder KozmoStok.app -ov -format UDZO KozmoStok-mac.dmg
          shasum -a 256 KozmoStok-mac.dmg > KozmoStok-mac.dmg.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: KozmoStok-mac
          path: |
            dist/KozmoStok-mac.zip
            dist/KozmoStok-mac.zip.sha256
            dist/KozmoStok-mac.dmg
            dist/KozmoStok-mac.dmg.sha256

      - name: Ozet (Actions sayfasinda gorunur)
        run: |
          echo "### KozmoStok macOS paketi hazir" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat dist/KozmoStok-mac.zip.sha256 dist/KozmoStok-mac.dmg.sha256 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
